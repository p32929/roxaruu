[package]
name = "roxaruu"
version = "0.2.41"
edition = "2024"

[dependencies]
# wgpu first (eframe's default); OpenGL (glow) when a machine's GPU driver
# can't give wgpu a window (a VM, Remote Desktop, an old driver).
eframe = { version = "0.37", features = ["glow"] }
json5 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
dirs = "5.0.1"
ignore = "0.4.23"
tree-sitter = "0.26.9"
tree-sitter-highlight = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
anyhow = "1.0.102"
ropey = "1.6.1"
memchr = "2"
arboard = "3.6"
portable-pty = "0.9.0"
vt100 = "0.16.2"
tracing = "0.1.41"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-c-sharp = "0.23"
tree-sitter-sequel = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ring = "0.17.14"
# Remote frames: lossless, small for screen content, decoded natively by browsers.
image-webp = "0.2.4"
egui-wgpu = "0.37"
wgpu = "30.0.1"
qrcode = { version = "0.14.1", default-features = false }

# Native "Open Folder" panel, everywhere (on macOS a folder picked there is
# granted by user intent, which sidesteps the Documents/Desktop prompt; on
# Linux it's the desktop's own, through its portal).
rfd = "0.15"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }
which = "8.0.6"
keepawake = "0.6.1"
dunce = "1.0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Where the pointer is when Finder drops a file (winit doesn't say), and
# holding off App Nap.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.19.0"
opener = { version = "0.9.0", features = ["reveal"] }
sysinfo = "0.40.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Tests (test-all, here and on CI): built 3x faster than the release (no
# link-time optimisation, less optimising), they run just as fast; the app
# people get is still `release`.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false

[package]
name = "roxaruu"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.37"
json5 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
dirs = "5.0.1"
ignore = "0.4.23"
tree-sitter = "0.26.9"
tree-sitter-highlight = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-toml-ng = "0.7.0"
anyhow = "1.0.102"
ropey = "1.6.1"
arboard = "3.6"
portable-pty = "0.9.0"
vt100 = "0.16.2"
tracing = "0.1.41"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"

# Native "Open Folder" panel. A folder picked there is granted by user intent,
# which sidesteps the macOS Documents/Desktop permission prompt.
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }
# Where the pointer is when Finder drops a file (winit doesn't say), and
# holding off App Nap.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSEvent", "NSRunningApplication", "NSScreen"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

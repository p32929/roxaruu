<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11524c"/><stop offset="1" stop-color="#072523"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <g clip-path="url(#clip)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
      <circle cx="760" cy="260" r="220" fill="#7bd49a" opacity=".35" filter="url(#blur)"/>
      <circle cx="260" cy="800" r="240" fill="#2dd4bf" opacity=".3" filter="url(#blur)"/>
      <rect x="180" y="300" width="664" height="424" rx="56" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".25" stroke-width="4"/>
      <text x="240" y="550" font-family="SF Mono, JetBrains Mono, Menlo, monospace" font-weight="700" font-size="104" fill="#7bd49a">$</text>
      <text x="330" y="550" font-family="SF Mono, JetBrains Mono, Menlo, monospace" font-weight="600" font-size="104" fill="#ecfdf5">rox .</text>
      <rect x="244" y="600" width="64" height="16" rx="8" fill="#ecfdf5" opacity=".9"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    </g>
    <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#fff" stroke-opacity=".12"/>
  </g>
</svg>

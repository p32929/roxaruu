<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Roxaruu — sign in</title>
<style>
  :root { --bg:#141417; --card:#1f1f24; --border:#2a2a31; --text:#ececf1; --muted:#a1a1ab; --accent:#f27b48; --error:#ff6b6b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f2ef; --card:#ffffff; --border:#e4e0da; --text:#1c1b19; --muted:#6f6b66; --accent:#d4572a; --error:#c62828; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:16px;
         padding:28px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:-.01em; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border);
          border-radius:10px; padding:12px 14px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { margin-top:14px; width:100%; font:inherit; font-weight:600; color:#1b0d06; background:var(--accent);
           border:0; border-radius:10px; padding:12px; cursor:pointer; }
  .error { color:var(--error); font-size:14px; margin:10px 0 0; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Roxaruu</h1>
  <p>Enter the remote-access password set in Roxaruu.</p>
  <input type="password" name="password" autocomplete="current-password" autofocus placeholder="Password" aria-label="Password">
  <div class="error">{{ERROR}}</div>
  <button type="submit">Open</button>
</form>
</body>
</html>

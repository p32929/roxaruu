# Publishes a release: builds, tests and packages Roxaruu for Windows, macOS
# and Linux, and — once every package is built — publishes GitHub release
# v<version> (Cargo.toml's) with all the downloads, replacing that version's
# release if it was published before. A failed test doesn't hold it back
# (the app may well still work); the release's notes say which system failed. It runs only when started
# by hand ("Run workflow" on GitHub, or `.githooks/release`), and asks
# nothing: never on a push, a tag or a pull request.
#
# Everything runs side by side: per system, one machine builds the packages
# (and opens the installed app; macOS: one per chip, joined after), two
# others build the tests (the faster `fast` profile) and run half each
# (tests.yml, which also runs alone as "Tests").
name: build

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every system (and macOS's two chips).
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
      mac: ${{ steps.pick.outputs.mac }}
    steps:
      - id: pick
        run: |
          systems='[{"name":"macOS","os":"macos-latest"},{"name":"Windows","os":"windows-latest"},{"name":"Linux","os":"ubuntu-22.04"}]'
          # macOS builds on two machines, one per chip, a disk image each.
          builds=$(jq -c '[.[] | if .name == "macOS" then
            (. + {name: "macOS Apple Silicon", target: "aarch64-apple-darwin"}),
            (. + {name: "macOS Intel", target: "x86_64-apple-darwin"}) else . end]' <<<"$systems")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "mac=true" >> "$GITHUB_OUTPUT"

  # Every test on every system: tests.yml, the same jobs "Tests" runs alone.
  test:
    uses: ./.github/workflows/tests.yml

  package:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libx11-xcb-dev libxcb1-dev libgl1-mesa-dev \
            libdbus-1-dev
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release ${{ matrix.target && format('--target {0}', matrix.target) }}
      - name: Keep this chip's programs (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/roxaruu
            target/${{ matrix.target }}/release/roxaruu-hook

      # ---- packages (macOS: in the `macos` job, from both chips) ----------

      - name: Package (Windows installer and zip)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp assets/icon.ico dist/roxaruu.ico
          cp packaging/rox.cmd dist/rox.cmd
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          # (Git Bash would take "/DVersion" for a path and rewrite it.)
          MSYS_NO_PATHCONV=1 "$ISCC" "/DVersion=$VERSION" packaging/roxaruu.iss
          7z a -mx9 "dist/roxaruu_v${VERSION}_windows_x64.zip" ./target/release/roxaruu.exe ./target/release/roxaruu-hook.exe ./dist/rox.cmd
          rm dist/roxaruu.ico dist/rox.cmd

      - name: Package (Linux .deb and .tar.xz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/512x512/apps \
            pkg/usr/share/icons/hicolor/scalable/apps
          cp target/release/roxaruu target/release/roxaruu-hook pkg/usr/bin/
          printf '#!/bin/sh\nexec /usr/bin/roxaruu "$@"\n' > pkg/usr/bin/rox
          chmod 755 pkg/usr/bin/roxaruu pkg/usr/bin/roxaruu-hook pkg/usr/bin/rox
          sed -e "s|@EXEC@|/usr/bin/roxaruu|" -e "s/@VERSION@/$VERSION/" packaging/roxaruu.desktop \
            > pkg/usr/share/applications/roxaruu.desktop
          cp assets/icon.png pkg/usr/share/icons/hicolor/512x512/apps/roxaruu.png
          cp assets/icon.svg pkg/usr/share/icons/hicolor/scalable/apps/roxaruu.svg # sharp at any size
          cat > pkg/DEBIAN/control <<EOF
          Package: roxaruu
          Version: $VERSION
          Architecture: amd64
          Maintainer: p32929 <https://github.com/p32929/roxaruu>
          Depends: libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6, libwayland-client0, libwayland-egl1, libgl1, libegl1, libvulkan1, libdbus-1-3
          Section: editors
          Priority: optional
          Homepage: https://github.com/p32929/roxaruu
          Description: A keyboard-first code editor with terminals built in
           Every shortcut is shown where it applies, every action is a command
           with a remappable key, and a project's terminals live beside its code.
           Remote access serves the same window to any browser.
          EOF
          # xz: zstd (the newer default) is unreadable to Debian 11 and older.
          dpkg-deb -Zxz -z9 --build --root-owner-group pkg "dist/roxaruu_v${VERSION}_linux_x64.deb"
          tar -cJf "dist/roxaruu_v${VERSION}_linux_x64.tar.xz" -C pkg/usr .

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: Roxaruu-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # ---- the real app, as people get it: installed, opened on a folder,
      # still running 20s later with its window drawn (its log says so), and
      # a screenshot to look at. ---------------------------------------------
      - name: Open it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $setup = (Get-ChildItem dist\*_setup.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Roxaruu\roxaruu.exe"
          if (!(Test-Path $exe)) { throw "the installer didn't put it at $exe" }
          Start-Process $exe -ArgumentList "`"$PWD`""
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke\windows.png")
          $log = "$env:LOCALAPPDATA\Roxaruu\roxaruu.log"
          if (Test-Path $log) { Copy-Item $log smoke\windows.log; Get-Content $log }
          if (-not (Get-Process roxaruu -ErrorAction SilentlyContinue)) { throw "Roxaruu isn't running" }
          if (-not (Select-String -Path $log -Pattern "the window is up" -Quiet)) { throw "its window never drew" }
          if (-not (Select-String -Path $log -Pattern "backend=Dx12" -Quiet)) { throw "it didn't draw through DirectX 12" }
          Stop-Process -Name roxaruu -Force
          # A GPU driver that kills the app (no error to catch): the next start
          # must see the try that never drew and draw with Windows' software DirectX instead.
          $state = "$env:LOCALAPPDATA\Roxaruu\renderer"
          [IO.File]::WriteAllText($state, "gpu:999999")
          Start-Process $exe -ArgumentList "`"$PWD`""
          Start-Sleep 20
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke\windows-safe.png")
          Copy-Item $log smoke\windows.log; Get-Content $log -Tail 8
          if (-not (Select-String -Path $log -Pattern "drawing the safe way" -Quiet)) { throw "it didn't fall back to software DirectX" }
          if ((Select-String -Path $log -Pattern "the window is up").Count -lt 2) { throw "its software DirectX window never drew" }
          if ((Get-Content $state) -ne "safe") { throw "it didn't remember the safe way: $(Get-Content $state)" }
          # Updating while it's open: the installer closes it, rather than
          # failing on a roxaruu.exe in use.
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/LOG=smoke\windows-update.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content smoke\windows-update.log -Tail 20; throw "updating with Roxaruu open failed ($($p.ExitCode))" }
          Stop-Process -Name roxaruu -Force -ErrorAction SilentlyContinue

      - name: Open it (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick mesa-vulkan-drivers libgl1-mesa-dri
          sudo apt-get install -y "./dist/roxaruu_v${VERSION}_linux_x64.deb"
          mkdir -p smoke
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            roxaruu --foreground "$PWD" & pid=$!
            sleep 20
            import -window root smoke/linux.png
            kill -0 $pid || { echo "Roxaruu exited"; exit 1; }
            kill $pid'
          log="$HOME/.local/share/Roxaruu/roxaruu.log"
          cp "$log" smoke/linux.log; cat "$log"
          grep -q "the window is up" "$log"
          # A GPU driver that kills the app: the next start uses OpenGL.
          printf 'gpu:999999' > "$HOME/.local/share/Roxaruu/renderer"
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            roxaruu --foreground "$PWD" & pid=$!
            sleep 20
            import -window root smoke/linux-safe.png
            kill -0 $pid || { echo "Roxaruu exited"; exit 1; }
            kill $pid'
          cp "$log" smoke/linux.log; tail -8 "$log"
          grep -q "drawing the safe way" "$log"
          [ "$(grep -c "the window is up" "$log")" -ge 2 ]
          [ "$(cat "$HOME/.local/share/Roxaruu/renderer")" = safe ]

      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'macOS'
        with:
          name: Screenshot-${{ matrix.name }}
          path: smoke/*
          if-no-files-found: ignore

  # A disk image per chip (Apple Silicon, Intel): one app for both would
  # carry everything twice (fonts and grammars too), twice the download.
  macos:
    name: macOS
    needs: [plan, package]
    if: needs.plan.outputs.mac == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Package (macOS, a disk image per chip)
        run: |
          mkdir -p dist
          for chip in apple-silicon:aarch64-apple-darwin intel:x86_64-apple-darwin; do
            name=${chip%%:*} target=${chip#*:}
            rm -rf dmg && mkdir -p dmg/Roxaruu.app/Contents/MacOS dmg/Roxaruu.app/Contents/Resources
            for exe in roxaruu roxaruu-hook; do
              install -m 755 "mac-$target/$exe" "dmg/Roxaruu.app/Contents/MacOS/$exe"
            done
            cp assets/AppIcon.icns dmg/Roxaruu.app/Contents/Resources/AppIcon.icns
            sed "s/@VERSION@/$VERSION/g" packaging/Info.plist > dmg/Roxaruu.app/Contents/Info.plist
            codesign --force --deep -s - dmg/Roxaruu.app
            ln -s /Applications dmg/Applications
            # Sized by hand: hdiutil's own guess runs out of room for big apps.
            size=$(( $(du -sm dmg | cut -f1) + 64 ))
            # LZMA (ULMO): the smallest disk image (macOS 10.15+).
            hdiutil create -volname Roxaruu -srcfolder dmg -size "${size}m" -ov -format ULMO "dist/roxaruu_v${VERSION}_macos_$name.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Roxaruu-macOS
          path: dist/*
          if-no-files-found: error
      - name: Open it (macOS)
        run: |
          mkdir -p smoke
          hdiutil attach -nobrowse -mountpoint /tmp/roxaruu "dist/roxaruu_v${VERSION}_macos_apple-silicon.dmg"
          mkdir -p "$HOME/Applications"
          cp -R /tmp/roxaruu/Roxaruu.app "$HOME/Applications/"
          "$HOME/Applications/Roxaruu.app/Contents/MacOS/roxaruu" --foreground "$PWD" & pid=$!
          sleep 20
          screencapture -x smoke/macos.png || true
          log="$HOME/Library/Application Support/Roxaruu/roxaruu.log"
          cp "$log" smoke/macos.log; cat "$log"
          kill -0 $pid || { echo "Roxaruu exited"; exit 1; }
          kill $pid
          grep -q "the window is up" "$log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-macOS
          path: smoke/*
          if-no-files-found: ignore

  # v<version> (Cargo.toml's), with every download, once every package is
  # built, whatever the tests said; a version released before is replaced
  # (its tag moves here too).
  release:
    name: Release
    needs: [package, macos, test]
    if: always() && needs.package.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read # which test jobs failed, for the notes
    env:
      GH_TOKEN: ${{ github.token }}
      TESTS: ${{ needs.test.result }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Roxaruu-*
          merge-multiple: true
      - name: Publish
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag was released before: replacing it"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          notes=""
          if [ "$TESTS" != success ]; then
            failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '[.jobs[] | select((.conclusion // "unfinished") != "success" and (.name | test(" tests "))) | .name] | join(", ")')
            notes="> [!WARNING]
          > Some tests failed in this build (${failed:-see the run}). It should still work; [the run]($RUN) shows what failed.
          "
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Roxaruu $tag" --notes "$notes" --generate-notes
          echo "published: $(gh release view "$tag" --json url -q .url)"

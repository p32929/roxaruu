# Every test, on every system — nothing built for download, nothing
# released. Runs alone as "Tests" (started by hand, or `.githooks/ci-tests`
# before a push: what this Mac can't run, Linux's and Windows' tests), and
# inside the release run (build.yml uses these same jobs). Never on a push.
name: tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # The unit tests, and on macOS and Linux the UI walkthroughs too
  # (`headless.rs`: real shells, simulated keys and clicks, screenshots), as
  # AGENTS.md runs them locally. Windows runs what's built for it (the
  # walkthroughs need a Unix shell yet). Each system in two halves, side by
  # side: most of a job is compiling, so more parts would mostly compile more.
  test:
    name: ${{ matrix.name }} tests ${{ matrix.part + 1 }}/2
    runs-on: ${{ matrix.os }}
    # Tests wait for what they expect however long it takes (no step has a
    # time limit to trip on a slow machine): this only ends a job that a
    # genuine bug left waiting forever. A run takes about 8 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [macOS, Windows, Linux]
        part: [0, 1]
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libx11-xcb-dev libxcb1-dev libgl1-mesa-dev \
            libdbus-1-dev zsh mesa-vulkan-drivers
      - name: Tests
        run: |
          # This machine's half, in a few processes, each with a scratch home
          # (as the pre-push hook runs them); each test's line as it finishes.
          SHOTS="$PWD/shots" SHELL="$(command -v zsh || echo "$SHELL")" \
            PART=${{ matrix.part }} PARTS=2 .githooks/test-all
      - name: Keep the tests' screenshots
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Test-screenshots-${{ matrix.name }}-${{ matrix.part }}
          path: shots/*
          if-no-files-found: ignore
